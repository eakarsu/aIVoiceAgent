name: governed-media-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voice
          POSTGRES_PASSWORD: voice
          POSTGRES_DB: voice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice -d voice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://voice:voice@127.0.0.1:5432/voice_test?schema=public
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      CORS_ORIGINS: http://127.0.0.1:3000
      MEDIA_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:deploy
      - run: npm test
      - run: npm run build
      - name: Reject destructive startup behavior
        run: >-
          ! grep -En '(prisma (db push|migrate reset|migrate dev)|npm (install|ci)|killall|pkill|DROP DATABASE|CREATE DATABASE|seed)' start.sh
